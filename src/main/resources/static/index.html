<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lecture Recorder - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (localStorage.getItem('lr-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <button class="theme-toggle standalone" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>

    <div class="login-box">
        <h1>Lecture Recorder</h1>
        <p class="subtitle">Open-source lecture recording &amp; anonymous doubts</p>

        <label>MID / Login ID</label>
        <input type="text" id="username" placeholder="e.g. 18544 or admin">

        <label>Password</label>
        <input type="password" id="password" placeholder="Password">

        <button class="primary" style="width:100%;" onclick="login()">Login</button>
        <div class="error-msg" id="error"></div>

        <div class="links">
            New student? <a href="register.html">Register here</a>
        </div>

        <p style="font-size:11px; color:var(--ink-faint); margin-top:20px; text-align:center;">
            Default admin (demo only): admin / admin123
        </p>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
