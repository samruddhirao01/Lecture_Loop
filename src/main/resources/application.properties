spring.application.name=lecture-recorder
server.port=8080

# H2 file-based database - data persists in ./data/lecturerecorder.mv.db
spring.datasource.url=jdbc:h2:file:./data/lecturerecorder;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allow large lecture video uploads
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# Where uploaded recordings are stored on disk
app.upload-dir=uploads/recordings

# Number of students tagging the same moment before it is flagged "hot" for the teacher
app.doubt-threshold=3
