<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-box" style="width:420px;">
        <h1>Student Registration</h1>
        <p class="subtitle">Only students currently enrolled in a class can register. An admin will verify your details before your account is activated.</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <label>Full Name</label>
            <input type="text" name="fullName" required>

            <label>College Roll Number / Student ID</label>
            <input type="text" name="rollNumber" required>
            <p class="hint">This must be your own ID. One roll number = one account, and it will be checked by the admin.</p>

            <label>Class / Section</label>
            <select name="sectionId" required>
                <option value="" disabled selected>Select your class</option>
                <option th:each="s : ${sections}" th:value="${s.id}" th:text="${s.name}"></option>
            </select>

            <label>Choose Username</label>
            <input type="text" name="username" required>

            <label>Choose Password</label>
            <input type="password" name="password" required>

            <button type="submit">Submit for Verification</button>
        </form>

        <div class="switch">
            Already have an account? <a th:href="@{/login}">Login</a>
        </div>
    </div>
</div>
</body>
</html>
