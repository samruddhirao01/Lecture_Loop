<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Quiz - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Teacher', ${teacher.fullName})}"></div>

<div class="container">
    <a th:href="@{/teacher/dashboard}" style="font-size:0.85rem;">&larr; Back to dashboard</a>

    <div class="card">
        <h2 th:text="${quiz.title} + (${quiz.poll} ? ' (Poll)' : ' (Quiz)')"></h2>

        <table>
            <thead><tr><th>#</th><th>Question</th><th>Options</th><th th:if="${!quiz.poll}">Correct</th></tr></thead>
            <tbody>
            <tr th:each="q, iter : ${questions}">
                <td th:text="${iter.count}"></td>
                <td th:text="${q.questionText}"></td>
                <td>
                    <div>1. <span th:text="${q.option1}"></span></div>
                    <div>2. <span th:text="${q.option2}"></span></div>
                    <div th:if="${q.option3 != null}">3. <span th:text="${q.option3}"></span></div>
                    <div th:if="${q.option4 != null}">4. <span th:text="${q.option4}"></span></div>
                </td>
                <td th:if="${!quiz.poll}" th:text="${q.correctOptionIndex}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(questions)}"><td colspan="4">No questions added yet.</td></tr>
            </tbody>
        </table>

        <a th:href="@{'/teacher/quizzes/' + ${quiz.id} + '/results'}" class="btn btn-sm" style="margin-top:14px;">View Results</a>
    </div>

    <div class="card">
        <h2>Add a Question</h2>
        <form th:action="@{'/teacher/quizzes/' + ${quiz.id} + '/questions/add'}" method="post">
            <label>Question</label>
            <textarea name="questionText" rows="2" required></textarea>

            <label>Option 1</label>
            <input type="text" name="option1" required>
            <label>Option 2</label>
            <input type="text" name="option2" required>
            <label>Option 3 (optional)</label>
            <input type="text" name="option3">
            <label>Option 4 (optional)</label>
            <input type="text" name="option4">

            <div th:if="${!quiz.poll}">
                <label>Correct Option (1-4)</label>
                <select name="correctOptionIndex" required>
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>

            <button type="submit">Add Question</button>
        </form>
    </div>
</div>
</body>
</html>
