<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <h1>Reset Password</h1>
        <p class="subtitle">For students only. Confirm your identity with your username and roll number.</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <label>Username</label>
            <input type="text" name="username" required>

            <label>College Roll Number / Student ID</label>
            <input type="text" name="rollNumber" required>

            <label>New Password</label>
            <input type="password" name="newPassword" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirmPassword" required>

            <button type="submit">Reset Password</button>
        </form>

        <p class="hint" style="margin-top:14px;">Teacher or admin account? Ask your admin to reset it for you.</p>

        <div class="switch">
            <a th:href="@{/login}">&larr; Back to login</a>
        </div>
    </div>
</div>
</body>
</html>
