<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Roster - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Teacher', ${teacher.fullName})}"></div>

<div class="container">
    <a th:href="@{/teacher/dashboard}" style="font-size:0.85rem;">&larr; Back to dashboard</a>
    <div class="card">
        <h2 th:text="'Students in ' + ${section.name}"></h2>
        <p class="hint" style="margin-top:-4px;">Only you can see these real names — students never see each other's identities.</p>
        <table>
            <thead><tr><th>Name</th><th>Roll No.</th><th>Username</th></tr></thead>
            <tbody>
            <tr th:each="st : ${students}">
                <td th:text="${st.fullName}"></td>
                <td th:text="${st.rollNumber}"></td>
                <td th:text="${st.username}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="3">No verified students in this section yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
