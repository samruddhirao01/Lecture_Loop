<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doubts - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Teacher', ${teacher.fullName})}"></div>

<div class="container">
    <a th:href="@{/teacher/dashboard}" style="font-size:0.85rem;">&larr; Back to dashboard</a>
    <div class="card">
        <h2 th:text="'Doubts for: ' + ${recording.title}"></h2>
        <p class="hint" style="margin-top:-4px;">
            A point is marked 🔥 Hot when <span th:text="${hotThreshold}"></span> or more students tagged near the same moment.
        </p>
        <table>
            <thead><tr><th>Time</th><th>Student</th><th>Roll No.</th><th>Comment</th></tr></thead>
            <tbody>
            <tr th:each="d : ${doubts}">
                <td th:text="${#numbers.formatInteger(d.timestampSeconds / 60, 1) + ':' + #numbers.formatInteger(d.timestampSeconds % 60, 2)}"></td>
                <td th:text="${d.student.fullName}"></td>
                <td th:text="${d.student.rollNumber}"></td>
                <td th:text="${d.comment != null and !d.comment.isEmpty()} ? ${d.comment} : '—'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(doubts)}"><td colspan="4">No doubts tagged on this recording yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
