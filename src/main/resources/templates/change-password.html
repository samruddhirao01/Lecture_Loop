<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <a th:href="@{/}" class="brand">🎥 Lecture Recorder</a>
    <div class="right">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Dashboard</a>
        <a sec:authorize="hasRole('TEACHER')" th:href="@{/teacher/dashboard}">Dashboard</a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}">Dashboard</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout">Logout</button>
        </form>
    </div>
</div>

<div class="auth-wrapper" style="min-height: 70vh;">
    <div class="auth-box">
        <h1>Change Password</h1>
        <p class="subtitle">Update your account password</p>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        <div th:if="${success}" class="success-msg" th:text="${success}"></div>

        <form th:action="@{/account/change-password}" method="post">
            <label>Current Password</label>
            <input type="password" name="currentPassword" required>

            <label>New Password</label>
            <input type="password" name="newPassword" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirmPassword" required>

            <button type="submit">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
