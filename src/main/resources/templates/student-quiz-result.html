<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${quiz.title}">Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${student.section.name}, ${student.fullName})}"></div>

<div class="container">
    <a th:href="@{/student/dashboard}" style="font-size:0.85rem;">&larr; Back to lectures</a>

    <div class="card" th:unless="${quiz.poll}">
        <h2 th:text="${quiz.title} + ' — Your Result'"></h2>
        <p style="font-size:1.4rem; font-weight:700; color:#12203e;"
           th:text="${score.correct()} + ' / ' + ${score.total()} + ' correct'"></p>
        <p class="hint">You've already attempted this quiz, so it can't be retaken.</p>
    </div>

    <div class="card" th:if="${quiz.poll}">
        <h2 th:text="${quiz.title} + ' — Poll Results'"></h2>
        <p class="hint" style="margin-top:-4px;">Thanks for voting! Here's how the class responded — anonymously.</p>

        <div th:each="pr : ${pollResults}" style="margin-bottom:22px;">
            <strong th:text="${pr.question().questionText}"></strong>
            <div class="marker-list" style="margin-top:8px;">
                <span class="marker" th:each="opt : ${pr.options()}"
                      th:text="${opt.label()} + ': ' + ${opt.count()}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
