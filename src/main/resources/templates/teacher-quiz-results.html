<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Results - Lecture Recorder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('Teacher', ${teacher.fullName})}"></div>

<div class="container">
    <a th:href="@{'/teacher/quizzes/' + ${quiz.id}}" style="font-size:0.85rem;">&larr; Back to quiz</a>

    <div class="card" th:if="${quiz.poll}">
        <h2 th:text="${quiz.title} + ' — Poll Results'"></h2>
        <p class="hint" style="margin-top:-4px;">Anonymous — votes are counted, not attributed to any student.</p>

        <div th:each="pr : ${pollResults}" style="margin-bottom:22px;">
            <strong th:text="${pr.question().questionText}"></strong>
            <div class="marker-list" style="margin-top:8px;">
                <span class="marker" th:each="opt : ${pr.options()}"
                      th:text="${opt.label()} + ': ' + ${opt.count()}"></span>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(pollResults)}">No questions yet.</p>
    </div>

    <div class="card" th:unless="${quiz.poll}">
        <h2 th:text="${quiz.title} + ' — Quiz Scores'"></h2>
        <table>
            <thead><tr><th>Student</th><th>Roll No.</th><th>Score</th></tr></thead>
            <tbody>
            <tr th:each="s : ${studentScores}">
                <td th:text="${s.student().fullName}"></td>
                <td th:text="${s.student().rollNumber}"></td>
                <td th:text="${s.correct()} + ' / ' + ${s.total()}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(studentScores)}"><td colspan="3">No attempts yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
